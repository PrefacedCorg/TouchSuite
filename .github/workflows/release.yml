name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，如 1.0.0）。留空则读取 TouchErase.csproj 的 <Version>'
        required: false
        type: string
      prerelease:
        description: '标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}".Trim()
          if (-not $v) {
            $m = Select-String -Path TouchErase.csproj -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "zip=TouchErase-v$v-win-x64.zip" >> $env:GITHUB_OUTPUT
          Write-Host "release version = $v"

      - name: Restore
        run: dotnet restore TouchErase.csproj

      - name: Build
        run: dotnet build TouchErase.csproj -c Release --no-restore

      - name: Publish (self-contained, single file, win-x64)
        run: >
          dotnet publish TouchErase.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "${{ steps.ver.outputs.zip }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchErase-v${{ steps.ver.outputs.version }}-win-x64
          path: ${{ steps.ver.outputs.zip }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TouchErase v${{ steps.ver.outputs.version }}
          files: ${{ steps.ver.outputs.zip }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
