name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，如 1.0.0）。留空则读取 TouchSuite.App.csproj 的 <Version>'
        required: false
        type: string
      prerelease:
        description: '标记为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

      app:
        description: '① TouchSuite.App（WPF 主程序，win-x64 单文件）'
        type: boolean
        default: true
      app_old:
        description: '② TouchSuite.App.old（旧主项目）'
        type: boolean
        default: false
      receiver:
        description: '③ TouchSuite.Receiver（TouchBridge 接收端）'
        type: boolean
        default: true
      android:
        description: '④ Android APK（debug 签名）'
        type: boolean
        default: true
      hidump:
        description: '⑤ TouchSuite.HidDump（HID 能力/报告描述符查看工具，win-x64 单文件）'
        type: boolean
        default: false
      driver:
        description: '⑥ 虚拟触摸屏驱动（自包含安装包）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 先统一解析版本号，供后面各 job 复用
  prepare:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="$(echo -n "${{ inputs.version }}" | tr -d '[:space:]')"
          if [ -z "$v" ]; then
            v="$(grep -oP '(?<=<Version>)[^<]+' src/TouchSuite.App/TouchSuite.App.csproj | head -n1)"
          fi
          if [ -z "$v" ]; then
            echo "无法解析版本号" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release version = $v"

  # ---- ① TouchSuite.App ----
  app:
    name: TouchSuite.App
    if: ${{ inputs.app }}
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish（自包含单文件 win-x64）
        run: >
          dotnet publish src/TouchSuite.App/TouchSuite.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ needs.prepare.outputs.version }}
          -o publish/app

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/app/* -DestinationPath "TouchSuite-v${{ needs.prepare.outputs.version }}-win-x64.zip" -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rel-app
          path: TouchSuite-v${{ needs.prepare.outputs.version }}-win-x64.zip
          if-no-files-found: error

  # ---- ② TouchSuite.App.old ----
  app_old:
    name: TouchSuite.App.old
    if: ${{ inputs.app_old }}
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish（自包含单文件 win-x64）
        run: >
          dotnet publish src/TouchSuite.App.old/TouchSuite.App.old.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ needs.prepare.outputs.version }}
          -o publish/app-old

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/app-old/* -DestinationPath "TouchSuite.App.old-v${{ needs.prepare.outputs.version }}-win-x64.zip" -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rel-app-old
          path: TouchSuite.App.old-v${{ needs.prepare.outputs.version }}-win-x64.zip
          if-no-files-found: error

  # ---- ③ TouchSuite.Receiver ----
  receiver:
    name: TouchSuite.Receiver
    if: ${{ inputs.receiver }}
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish（自包含单文件 win-x64）
        run: >
          dotnet publish src/TouchSuite.Receiver/TouchSuite.Receiver.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ needs.prepare.outputs.version }}
          -o publish/receiver

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/receiver/* -DestinationPath "TouchSuite.Receiver-v${{ needs.prepare.outputs.version }}-win-x64.zip" -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rel-receiver
          path: TouchSuite.Receiver-v${{ needs.prepare.outputs.version }}-win-x64.zip
          if-no-files-found: error

  # ---- ④ Android ----
  android:
    name: Android（APK）
    if: ${{ inputs.android }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓内未配置 release 签名，故出 debug 签名包（可直接安装）。
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "TouchSuite-v${{ needs.prepare.outputs.version }}-android.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: TouchSuite-v${{ needs.prepare.outputs.version }}-android.apk
          if-no-files-found: error

  # ---- ⑤ TouchSuite.HidDump ----
  hidump:
    name: TouchSuite.HidDump
    if: ${{ inputs.hidump }}
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish（自包含单文件 win-x64）
        run: >
          dotnet publish src/TouchSuite.HidDump/TouchSuite.HidDump.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ needs.prepare.outputs.version }}
          -o publish/hidump

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/hidump/* -DestinationPath "TouchSuite.HidDump-v${{ needs.prepare.outputs.version }}-win-x64.zip" -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rel-hidump
          path: TouchSuite.HidDump-v${{ needs.prepare.outputs.version }}-win-x64.zip
          if-no-files-found: error

  # ---- ⑥ 驱动（复用 driver.yml，产出 TouchBridgeVhid-driver.zip）----
  driver:
    name: 驱动（自包含安装包）
    if: ${{ inputs.driver }}
    uses: ./.github/workflows/driver.yml

  # ---- 汇总发布 ----
  publish:
    name: 创建 GitHub Release
    needs: [ prepare, app, app_old, receiver, android, hidump, driver ]
    # 有组件被跳过（未勾选）时也要跑，故用 always()
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 校验产物
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有任何产物，请至少勾选一个组件"
            exit 1
          fi
          echo "将发布以下文件："
          printf '  %s\n' "${files[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: TouchSuite v${{ needs.prepare.outputs.version }}
          files: artifacts/*/*
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}