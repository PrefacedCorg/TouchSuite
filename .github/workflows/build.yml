name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET（WPF / 控制台）
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TouchSuite.sln

      - name: Build
        run: dotnet build TouchSuite.sln -c Release --no-restore

  android:
    name: Android（APK）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK 并已设置 ANDROID_HOME，
      # 所以无需 local.properties，gradlew 会自动取到 SDK 路径。
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchSuite-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/TouchBridge-debug.apk
          if-no-files-found: error