name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $m = Select-String -Path TouchErase.csproj -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "zip=TouchErase-v$v-win-x64.zip" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      - name: Restore
        run: dotnet restore TouchErase.csproj

      - name: Build
        run: dotnet build TouchErase.csproj -c Release --no-restore

      - name: Publish (self-contained, single file, win-x64)
        run: >
          dotnet publish TouchErase.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "${{ steps.ver.outputs.zip }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchErase-win-x64
          path: ${{ steps.ver.outputs.zip }}
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.zip }}
          generate_release_notes: true
